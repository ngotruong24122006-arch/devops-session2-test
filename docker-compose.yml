
services:
  candidate-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: candidate-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://candidate-db:5432/candidate_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234$
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      candidate-db:
        condition: service_healthy

  candidate-db:
    image: postgres:13
    container_name: candidate-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234$
      POSTGRES_DB: candidate_db
    volumes:
      - department-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d candidate_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  candidate-db-data:
